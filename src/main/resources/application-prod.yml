spring:
  application:
    name: unomas-credito-backend
  datasource:
    # Railway provee DATABASE_URL; si no está disponible, usamos variables individuales
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:unomasdb}
    username: ${PGUSER:unomas}
    password: ${PGPASSWORD:unomas}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
    
      ddl-auto: update  # Cambiar de 'validate' a 'update'
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:cambiar-este-secreto-en-produccion-cambiar-este-secreto-en-produccion}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  payment:
    redirect-url: "https://micrositio.padlock.com.co/unotuno"
  sadmin:
    token-url: ${SADMIN_TOKEN_URL:https://api.sadmin.net/token}
    username: ${SADMIN_USERNAME:}
    password: ${SADMIN_PASSWORD:}
    credito-url: ${SADMIN_CREDITO_URL:}
